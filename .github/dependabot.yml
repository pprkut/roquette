version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # The development tools pinned in pyproject.toml's dependency groups.
  # The runtime dependencies are ranges and are only raised when a new
  # release falls outside them.
  - package-ecosystem: "pip"
    directory: "/"
    # The lower ends of those ranges, for CI's test with the oldest
    # dependencies. They change only with the ranges themselves.
    exclude-paths:
      - "ci/oldest.txt"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    versioning-strategy: "increase-if-necessary"
